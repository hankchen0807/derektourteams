<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未來行程預告</title>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            margin: 0;
            padding: 0;
            background: url() no-repeat center center fixed;
            background-size: cover;
        }
        .home-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #3498db;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 1em;
            font-weight: bold;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }
        .home-button:hover {
            background: #2980b9;
        }
        .container {
            max-width: 90%;
            margin: 50px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            font-size: 1.8em;
            margin-bottom: 15px;
        }
        iframe {
            border: 0;
            width: 100%;
            height: 600px;
        }
    </style>
</head>
<body>
    <a href="樂哥旅行團.html" class="home-button">🏠 回首頁</a>
    <div class="container">
        <h2>未來行程預告 📅✈️</h2>
        <p>探索世界，記錄行程，精彩不容錯過！</p>

        <!-- 嵌入 Google 行事曆 iframe -->
        <iframe 
            src="https://calendar.google.com/calendar/embed?src=derektourteams%40gmail.com&ctz=Asia%2FTaipei" 
            frameborder="0" 
            scrolling="no">
        </iframe>

        <p>敬請關注更多更新！</p>
    </div>
</body>
</html>
